<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Admin Access</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      text-align: center;
      width: 100%;
      max-width: 350px;
    }
    h2 {
      margin-bottom: 8px;
      font-size: 18px;
    }
    .subtitle {
      color: #888;
      font-size: 12px;
      margin-bottom: 20px;
    }
    input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #333;
      border-radius: 8px;
      background: #0f0f1a;
      color: #fff;
      font-size: 14px;
      margin-bottom: 12px;
    }
    input:focus {
      outline: none;
      border-color: #6366f1;
    }
    .buttons {
      display: flex;
      gap: 10px;
    }
    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover {
      opacity: 0.9;
    }
    .btn-primary {
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      color: #fff;
    }
    .btn-secondary {
      background: #333;
      color: #fff;
    }
    .error {
      color: #f87171;
      font-size: 12px;
      margin-top: 8px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>🔐 Acesso Administrativo</h2>
    <p class="subtitle">Digite a senha de administrador para acessar as configurações</p>
    
    <input type="password" id="adminPassword" placeholder="Senha do administrador" autofocus>
    <p class="error" id="errorMsg">Senha incorreta</p>
    
    <div class="buttons">
      <button class="btn-secondary" onclick="window.close()">Cancelar</button>
      <button class="btn-primary" onclick="verifyPassword()">Acessar</button>
    </div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    document.getElementById('adminPassword').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        verifyPassword();
      }
    });

    function verifyPassword() {
      const password = document.getElementById('adminPassword').value;
      const isValid = ipcRenderer.sendSync('admin-verify', password);
      
      if (isValid) {
        ipcRenderer.send('exit-stealth');
        window.close();
      } else {
        document.getElementById('errorMsg').style.display = 'block';
        document.getElementById('adminPassword').value = '';
        document.getElementById('adminPassword').focus();
      }
    }
  </script>
</body>
</html>
