<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sentinela Agent</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-app-region: drag;
      user-select: none;
    }
    .titlebar {
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      background: #0b1120;
      font-size: 12px;
      color: #64748b;
    }
    .titlebar-close {
      -webkit-app-region: no-drag;
      background: none;
      border: none;
      color: #64748b;
      cursor: pointer;
      font-size: 16px;
      padding: 4px 8px;
      border-radius: 4px;
    }
    .titlebar-close:hover { background: #1e293b; color: #f87171; }
    .content {
      flex: 1;
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      -webkit-app-region: no-drag;
      overflow-y: auto;
    }
    .logo {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin-bottom: 16px;
    }
    h1 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
    .subtitle { font-size: 13px; color: #64748b; margin-bottom: 32px; }
    .status-card {
      width: 100%;
      background: #1e293b;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
    }
    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
    }
    .status-label { font-size: 13px; color: #94a3b8; }
    .status-value { font-size: 13px; font-weight: 600; }
    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 6px;
    }
    .status-dot.online { background: #22c55e; box-shadow: 0 0 6px #22c55e; }
    .status-dot.offline { background: #ef4444; }
    .input-group {
      width: 100%;
      margin-bottom: 16px;
    }
    .input-group label {
      display: block;
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .input-group input {
      width: 100%;
      padding: 12px 16px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #e2e8f0;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .input-group input:focus { border-color: #3b82f6; }
    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .btn-primary { background: linear-gradient(135deg, #3b82f6, #8b5cf6); color: white; }
    .btn-danger { background: #dc2626; color: white; margin-top: 8px; }
    .error { color: #f87171; font-size: 13px; margin-top: 8px; text-align: center; }
    .services-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      width: 100%;
    }
    .service-badge {
      background: #1e293b;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .service-badge .dot { width: 6px; height: 6px; border-radius: 50%; background: #22c55e; }
    #setup-view, #connected-view { display: none; width: 100%; }
  </style>
</head>
<body>
  <div class="titlebar">
    <span>Sentinela Agent</span>
    <button class="titlebar-close" id="btn-close">✕</button>
  </div>

  <div class="content">
    <div class="logo">🛡️</div>
    <h1>Sentinela</h1>
    <p class="subtitle">Agente de Monitoramento</p>

    <!-- Setup View -->
    <div id="setup-view">
      <div class="input-group">
        <label>Chave do Agente</label>
        <input type="text" id="agent-key-input" placeholder="Cole sua Agent Key aqui..." />
      </div>
      <button class="btn btn-primary" id="btn-connect">Conectar</button>
      <p class="error" id="error-msg"></p>
    </div>

    <!-- Connected View -->
    <div id="connected-view">
      <div class="status-card">
        <div class="status-row">
          <span class="status-label">Status</span>
          <span class="status-value"><span class="status-dot online"></span>Conectado</span>
        </div>
        <div class="status-row">
          <span class="status-label">Chave</span>
          <span class="status-value" id="display-key">****</span>
        </div>
        <div class="status-row">
          <span class="status-label">Versão</span>
          <span class="status-value" id="display-version">1.0.0</span>
        </div>
      </div>

      <p class="subtitle" style="margin-bottom: 12px; align-self: flex-start;">Serviços Ativos</p>
      <div class="services-grid">
        <div class="service-badge"><span class="dot"></span> Screenshots</div>
        <div class="service-badge"><span class="dot"></span> Teclas</div>
        <div class="service-badge"><span class="dot"></span> Aplicativos</div>
        <div class="service-badge"><span class="dot"></span> USB Block</div>
        <div class="service-badge"><span class="dot"></span> PrintScreen</div>
        <div class="service-badge"><span class="dot"></span> Idle</div>
      </div>
    </div>
  </div>

  <script>
    const setupView = document.getElementById('setup-view');
    const connectedView = document.getElementById('connected-view');
    const agentKeyInput = document.getElementById('agent-key-input');
    const btnConnect = document.getElementById('btn-connect');
    const errorMsg = document.getElementById('error-msg');
    const displayKey = document.getElementById('display-key');
    const displayVersion = document.getElementById('display-version');
    const btnClose = document.getElementById('btn-close');

    btnClose.addEventListener('click', () => window.close());

    // Check initial status
    window.sentinelaAPI.getStatus().then(status => {
      if (status.authenticated) {
        showConnected(status);
      } else {
        setupView.style.display = 'block';
      }
    });

    btnConnect.addEventListener('click', async () => {
      const key = agentKeyInput.value.trim();
      if (!key) {
        errorMsg.textContent = 'Insira a chave do agente';
        return;
      }

      btnConnect.disabled = true;
      btnConnect.textContent = 'Conectando...';
      errorMsg.textContent = '';

      const result = await window.sentinelaAPI.setAgentKey(key);
      
      if (result.success) {
        const status = await window.sentinelaAPI.getStatus();
        showConnected(status);
      } else {
        errorMsg.textContent = 'Chave inválida ou inativa';
        btnConnect.disabled = false;
        btnConnect.textContent = 'Conectar';
      }
    });

    window.sentinelaAPI.onAuthError((error) => {
      errorMsg.textContent = error;
      setupView.style.display = 'block';
      connectedView.style.display = 'none';
    });

    function showConnected(status) {
      setupView.style.display = 'none';
      connectedView.style.display = 'block';
      displayKey.textContent = status.agentKey || '****';
      displayVersion.textContent = status.version || '1.0.0';
    }
  </script>
</body>
</html>
