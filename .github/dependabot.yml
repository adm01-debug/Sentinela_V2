version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      # Os grupos abaixo existem para manter juntos os pacotes que têm peer
      # dependency entre si. Quando eles sobem separados, o `npm ci` quebra —
      # foi exatamente o que aconteceu com eslint x @typescript-eslint e com
      # react-i18next x i18next, deixando o CI vermelho por meses.
      # Ao editar, lembre que o padrão `eslint*` NÃO casa com `@typescript-eslint/*`.
      lint:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "@typescript-eslint/*"
          - "prettier"
          - "prettier-*"
          - "globals"
      test:
        patterns:
          - "vite"
          - "vitest"
          - "@vitest/*"
          - "@vitejs/*"
          - "@testing-library/*"
          - "jsdom"
          - "@playwright/*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "react-router*"
          - "@types/react"
          - "@types/react-dom"
          - "@tanstack/*"
          - "@radix-ui/*"
          - "lucide-react"
          - "cmdk"
          - "framer-motion"
          - "recharts"
          - "sonner"
      i18n:
        patterns:
          - "i18next"
          - "i18next-*"
          - "react-i18next"
      types:
        patterns:
          - "@types/*"
        exclude-patterns:
          - "@types/react"
          - "@types/react-dom"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "ci"
