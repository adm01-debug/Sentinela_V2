name: Update Dependencies
on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm update
        # npm audit fix sai com exit 1 quando há vulnerabilidades sem fix automático
        # (xlsx/sheetjs não tem correção; @typescript-eslint/minimatch/postcss exigem --force = breaking).
        # O objetivo do workflow é abrir o PR de update revisável; o gate real de segurança é o npm audit no ci.yml.
      - run: npm audit fix || true
      - uses: peter-evans/create-pull-request@v7
        with:
          title: 'chore: update dependencies'
          branch: deps/weekly-update
