name: Build Android
on:
  push:
    branches: [main]
    paths: ['mobile-app/**']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build APK
        run: cd mobile-app && ./gradlew assembleRelease