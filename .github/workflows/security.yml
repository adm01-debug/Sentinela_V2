name: Security Scan
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: npm audit --audit-level=high
      - uses: snyk/actions/node@b98d498629f1c5e001b8c9a56f7ac77d51ce406b # v0.4.0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      - uses: github/codeql-action/init@45775bd8235c68a3f82a6283b787ef86d6f2c77b # v3.28.4
        with:
          languages: javascript
      - uses: github/codeql-action/analyze@45775bd8235c68a3f82a6283b787ef86d6f2c77b # v3.28.4
