name: Release
on:
  push:
    tags: ['v*']
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
      # "npm run build" chama "bun scripts/generate-audit-pdf.js" (package.json);
      # o runner ubuntu-latest não traz bun por padrão.
      - uses: oven-sh/setup-bun@v2
      - run: npm run build
      - uses: softprops/action-gh-release@v1
        with:
          files: dist/*
          generate_release_notes: true