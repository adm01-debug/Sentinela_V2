name: Lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # Ratchet: falha só se surgir ocorrência nova acima do baseline.
      # Ver scripts/ci/README.md. Baseline capturado em 08/11/2026 (PR #93).
      # `tsc --noEmit` era no-op nesta config (references sem --build); o ratchet
      # usa `tsc -b --force` que respeita as referencias e checa de verdade.
      - name: Lint (ratchet)
        run: node scripts/ci/lint-ratchet.mjs

      - name: Type Check (ratchet)
        run: node scripts/ci/typecheck-ratchet.mjs
