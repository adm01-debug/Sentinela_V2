name: Performance Benchmark
on:
  pull_request:
    branches: [main]

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
      - run: npm run build
      - name: Run benchmarks
        run: npx lighthouse-ci autorun
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: .lighthouseci/
