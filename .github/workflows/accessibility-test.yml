name: Accessibility Test
on:
  pull_request:
    branches: [main]
jobs:
  a11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
      - run: npm ci
      - run: npm run build
      - name: Run axe
        run: npx @axe-core/cli http://localhost:3000