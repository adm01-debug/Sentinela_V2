name: Prune edge functions

# Apaga edge functions de producao. Existe porque o deploy nao apaga: deploy.yml
# publica o que esta em supabase/functions (que ele mesmo documenta: sem nome de
# funcao, o CLI publica todas as do repo) e a funcao removida do codigo continua
# viva no projeto - o CLI e explicito no help ("supabase functions delete:
# This does NOT remove the Function locally", e a via inversa vale igual).
#
# Por isso a limpeza das 38 edges legadas sem chamador (25/11/2026) precisou
# deste passo separado, com a lista escrita a mao.
#
# So disparo manual: nada aqui roda em push ou PR. A lista vazia e nome que ainda
# existe no repo abortam antes de tocar em producao.
on:
  workflow_dispatch:
    inputs:
      functions:
        description: "Nomes separados por virgula (ex: archive-data,audit-export)"
        required: true
        type: string

jobs:
  prune:
    runs-on: ubuntu-latest
    concurrency:
      group: supabase-functions-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0
      - name: Conferir a lista antes de apagar
        env:
          NAMES: ${{ inputs.functions }}
        run: |
          set -euo pipefail
          printf '%s' "$NAMES" | tr ',' '\n' | sed 's/^ *//;s/ *$//' | grep -v '^$' > /tmp/names.txt
          total=$(wc -l < /tmp/names.txt)
          if [ "$total" -eq 0 ]; then
            echo "::error::lista vazia; nada a apagar."
            exit 1
          fi
          while read -r fn; do
            if ! printf '%s' "$fn" | grep -qE '^[a-z0-9][a-z0-9-]*$'; then
              echo "::error::nome invalido: '$fn'."
              exit 1
            fi
            # Trava de seguranca: este workflow e para funcao que ja saiu do repo.
            # Se a pasta existe, apagar aqui derruba codigo vivo por engano.
            if [ -d "supabase/functions/$fn" ]; then
              echo "::error::$fn ainda existe em supabase/functions; remova do repo antes de apagar em producao."
              exit 1
            fi
          done < /tmp/names.txt
          echo "Funcoes que serao apagadas de jgnmwvzephsozsqmcpzb ($total):"
          cat /tmp/names.txt
      - name: Apagar em producao
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN ausente."
            exit 1
          fi
          while read -r fn; do
            echo "::group::delete $fn"
            bash scripts/lib/supabase-retry.sh supabase functions delete --yes --remote=jgnmwvzephsozsqmcpzb "$fn"
            echo "::endgroup::"
          done < /tmp/names.txt
      - name: Confirmar que sumiram
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          bash scripts/lib/supabase-retry.sh supabase functions list --remote=jgnmwvzephsozsqmcpzb > /tmp/depois.txt
          sobrou=0
          while read -r fn; do
            if grep -qw "$fn" /tmp/depois.txt; then
              echo "::error::$fn continua listada em producao."
              sobrou=1
            fi
          done < /tmp/names.txt
          if [ "$sobrou" -ne 0 ]; then
            exit 1
          fi
          echo "OK: nenhuma das funcoes apagadas segue listada em producao."
