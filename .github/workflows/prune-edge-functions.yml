name: Prune edge functions

# Apaga edge functions de producao. Existe porque o deploy nao apaga: deploy.yml
# publica o que esta em supabase/functions (que ele mesmo documenta: sem nome de
# funcao, o CLI publica todas as do repo) e a funcao removida do codigo continua
# viva no projeto - o CLI e explicito no help ("supabase functions delete:
# This does NOT remove the Function locally", e a via inversa vale igual).
#
# Por isso a limpeza das 38 edges legadas sem chamador (25/11/2026) precisou
# deste passo separado, com a lista escrita a mao.
#
# So disparo manual: nada aqui roda em push ou PR. A lista vazia e nome que ainda
# existe no repo abortam antes de tocar em producao.
on:
  workflow_dispatch:
    inputs:
      functions:
        description: "Nomes separados por virgula (ex: archive-data,audit-export)"
        required: true
        type: string

jobs:
  prune:
    runs-on: ubuntu-latest
    concurrency:
      group: supabase-functions-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0
      - name: Conferir a lista antes de apagar
        env:
          NAMES: ${{ inputs.functions }}
        run: |
          set -euo pipefail
          printf '%s' "$NAMES" | tr ',' '\n' | sed 's/^ *//;s/ *$//' | grep -v '^$' > /tmp/names.txt
          total=$(wc -l < /tmp/names.txt)
          if [ "$total" -eq 0 ]; then
            echo "::error::lista vazia; nada a apagar."
            exit 1
          fi
          while read -r fn; do
            if ! printf '%s' "$fn" | grep -qE '^[a-z0-9][a-z0-9-]*$'; then
              echo "::error::nome invalido: '$fn'."
              exit 1
            fi
            # Trava de seguranca: este workflow e para funcao que ja saiu do repo.
            # Se a pasta existe, apagar aqui derruba codigo vivo por engano.
            if [ -d "supabase/functions/$fn" ]; then
              echo "::error::$fn ainda existe em supabase/functions; remova do repo antes de apagar em producao."
              exit 1
            fi
          done < /tmp/names.txt
          echo "Funcoes que serao apagadas de jgnmwvzephsozsqmcpzb ($total):"
          cat /tmp/names.txt
      - name: Apagar em producao
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN ausente."
            exit 1
          fi
          while read -r fn; do
            echo "::group::delete $fn"
            saida=$(mktemp)
            if bash scripts/lib/supabase-retry.sh supabase functions delete --yes --remote=jgnmwvzephsozsqmcpzb "$fn" >"$saida" 2>&1; then
              cat "$saida"
            elif grep -qiE 'not found|does not exist|404' "$saida"; then
              # Reexecucao: a funcao ja saiu numa execucao anterior (o run de
              # 261125 parou so na confirmacao). Apagar de novo nao e erro.
              echo "$fn ja nao existe em producao; seguindo."
            else
              cat "$saida"
              echo "::error::falha ao apagar $fn."
              exit 1
            fi
            echo "::endgroup::"
          done < /tmp/names.txt
      - name: Confirmar que sumiram da superficie publica
        # A prova e o endpoint publico, nao a tabela do CLI: funcao apagada
        # responde 404 e funcao viva responde 401 (o gateway exige JWT). O run
        # de 261125 falhou por um falso vermelho aqui - grep -w "health" casa
        # com o nome "health-check" - entao a comparacao passou a ser por URL.
        run: |
          set -euo pipefail
          vivo=0
          while read -r fn; do
            codigo=000
            for _ in 1 2 3; do
              codigo=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "https://jgnmwvzephsozsqmcpzb.supabase.co/functions/v1/$fn")
              if [ "$codigo" = "404" ]; then break; fi
              sleep 5
            done
            if [ "$codigo" = "404" ]; then
              echo "$fn -> 404 (fora do ar)"
            else
              echo "::error::$fn ainda responde HTTP $codigo em producao."
              vivo=1
            fi
          done < /tmp/names.txt
          if [ "$vivo" -ne 0 ]; then
            exit 1
          fi
          echo "OK: todas as funcoes da lista responderam 404."
