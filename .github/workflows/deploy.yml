name: Deploy

# O deploy de producao do Sentinela_V2 e feito pela integracao Vercel <-> GitHub
# (app `vercel[bot]`, deployment de `Production` em cada push para `main`).
# Este workflow apenas AUDITA esse deploy: confirma que existe deployment de
# producao para o commit e falha se nao houver. Ele nao publica nada, para nao
# duplicar/competir com a integracao nativa.
#
# Historico: ate 261121 este job rodava `npx vercel deploy` e falhava em todo
# push com "Could not retrieve Project Settings" porque o runner nao tem o
# diretorio .vercel (nao versionado), e sem vercel pull/link o CLI nao sabe qual projeto usar.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: read

jobs:
  # Aplica as migrations pendentes do repositorio no banco de PRODUCAO.
  # Antes disto o repo e o banco viviam divergindo: o merge quebrava nada, mas
  # a feature so funcionava depois de alguem rodar o SQL a mao. Causa raiz dos
  # incidentes de 21-22/11 (departments sem policy de escrita, bucket de
  # backup inexistente, 6 funcoes expostas a anon, 10 tabelas consumidas pelo
  # front sem existir no banco).
  # Idempotente: o Supabase CLI registra o que ja aplicou em
  # supabase_migrations.schema_migrations e so roda o que falta. Toda migration
  # nova precisa ser reaplicavel (DROP ... IF EXISTS antes de CREATE).
  migrate:
    runs-on: ubuntu-latest
    concurrency:
      group: supabase-migrate-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Aplicar migrations pendentes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          supabase link --project-ref jgnmwvzephsozsqmcpzb
          supabase db push --include-all

  verify-production-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Confirma deployment de producao para o commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "Commit: $SHA"
          # A integracao Vercel <-> GitHub registra o deployment alguns segundos
          # depois do push. Este job espera ate ~6 min antes de declarar ausencia,
          # para nao falhar por corrida com a Vercel.
          latest=""
          for i in $(seq 1 18); do
            deployments=$(gh api "repos/$REPO/deployments?sha=$SHA&per_page=100")
            latest=$(echo "$deployments" | jq -r '[.[] | select(.environment == "Production")][0].id // empty')
            if [ -n "$latest" ]; then
              echo "Deployment de producao encontrado: $latest (tentativa $i)"
              break
            fi
            echo "Nenhum deployment de producao ainda (tentativa $i/18), aguardando 20s..."
            sleep 20
          done
          if [ -z "$latest" ]; then
            echo "::error::Nenhum deployment de producao para $SHA. O deploy automatico da Vercel nao rodou."
            exit 1
          fi
          for i in $(seq 1 24); do
            state=$(gh api "repos/$REPO/deployments/$latest/statuses" | jq -r '.[0].state // empty')
            echo "Deployment $latest -> ${state:-sem status} (tentativa $i)"
            case "$state" in
              success) echo "Deploy de producao confirmado para $SHA ($state)."; exit 0 ;;
              failure|error|inactive) echo "::error::Deployment $latest terminou com estado '$state'."; exit 1 ;;
            esac
            sleep 20
          done
          echo "::error::Deployment $latest nao concluiu em ~8 min (ultimo estado: ${state:-vazio})."
          exit 1