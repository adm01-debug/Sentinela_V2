name: Deploy

# O deploy de producao do Sentinela_V2 e feito pela integracao Vercel <-> GitHub
# (app `vercel[bot]`, deployment de `Production` em cada push para `main`).
# Este workflow apenas AUDITA esse deploy: confirma que existe deployment de
# producao para o commit e falha se nao houver. Ele nao publica nada, para nao
# duplicar/competir com a integracao nativa.
#
# Historico: ate 261121 este job rodava `npx vercel deploy` e falhava em todo
# push com "Could not retrieve Project Settings" porque o runner nao tem o
# diretorio .vercel (nao versionado), e sem vercel pull/link o CLI nao sabe qual projeto usar.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: read

jobs:
  # Aplica as migrations pendentes do repositorio no banco de PRODUCAO.
  # Antes disto o repo e o banco viviam divergindo: o merge quebrava nada, mas
  # a feature so funcionava depois de alguem rodar o SQL a mao. Causa raiz dos
  # incidentes de 21-22/11 (departments sem policy de escrita, bucket de
  # backup inexistente, 6 funcoes expostas a anon, 10 tabelas consumidas pelo
  # front sem existir no banco).
  # Idempotente: o Supabase CLI registra o que ja aplicou em
  # supabase_migrations.schema_migrations e so roda o que falta. Toda migration
  # nova precisa ser reaplicavel (DROP ... IF EXISTS antes de CREATE).
  migrate:
    runs-on: ubuntu-latest
    concurrency:
      group: supabase-migrate-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      # Versao fixada: `latest` faz o setup-cli resolver a release pela API do
      # GitHub, e o rate limit do runner derrubou o job migrate em 261122
      # ("Failed to resolve latest Supabase CLI release: rate limit exceeded").
      # Pinar tambem torna o deploy reproduzivel. Atualizar junto com o
      # `supabase` local (package.json) quando houver motivo.
      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0
      - name: Aplicar migrations pendentes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          supabase link --project-ref jgnmwvzephsozsqmcpzb
          # --yes e obrigatorio: com migration pendente o CLI pede confirmacao
          # e, sem terminal, aborta com "Confirmation required ... Nothing was
          # changed". O job ficava vermelho e a migration nao era aplicada
          # (aconteceu no deploy de 261122, run 45052256730).
          supabase db push --remote --include-all --yes

  # Publica em producao TODAS as edge functions versionadas em supabase/functions.
  # Antes disto o workflow so aplicava migrations: uma correcao de edge function
  # mergeada na main ficava no GitHub e a producao continuava rodando o bundle
  # antigo (foi o que aconteceu com send-password-reset, que precisou de deploy
  # manual em 261122).
  deploy-functions:
    runs-on: ubuntu-latest
    concurrency:
      group: supabase-functions-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0
      - name: Publicar edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          supabase link --project-ref jgnmwvzephsozsqmcpzb
          # --yes: o runner e nao interativo; sem isto o CLI aborta pedindo
          # confirmacao da mutacao em producao.
          # --use-api: empacota no servidor, sem Docker no runner.
          # Sem nome de funcao o CLI publica todas as de supabase/functions.
          supabase functions deploy --yes --use-api

  verify-production-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Confirma deployment de producao para o commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "Commit: $SHA"
          # A integracao Vercel <-> GitHub registra o deployment alguns segundos
          # depois do push. Este job espera ate ~6 min antes de declarar ausencia,
          # para nao falhar por corrida com a Vercel.
          latest=""
          for i in $(seq 1 18); do
            deployments=$(gh api "repos/$REPO/deployments?sha=$SHA&per_page=100")
            latest=$(echo "$deployments" | jq -r '[.[] | select(.environment == "Production")][0].id // empty')
            if [ -n "$latest" ]; then
              echo "Deployment de producao encontrado: $latest (tentativa $i)"
              break
            fi
            echo "Nenhum deployment de producao ainda (tentativa $i/18), aguardando 20s..."
            sleep 20
          done
          if [ -z "$latest" ]; then
            echo "::error::Nenhum deployment de producao para $SHA. O deploy automatico da Vercel nao rodou."
            exit 1
          fi
          for i in $(seq 1 24); do
            state=$(gh api "repos/$REPO/deployments/$latest/statuses" | jq -r '.[0].state // empty')
            echo "Deployment $latest -> ${state:-sem status} (tentativa $i)"
            case "$state" in
              success) echo "Deploy de producao confirmado para $SHA ($state)."; break ;;
              failure|error|inactive) echo "::error::Deployment $latest terminou com estado '$state'."; exit 1 ;;
            esac
            sleep 20
          done
          echo "::error::Deployment $latest nao concluiu em ~8 min (ultimo estado: ${state:-vazio})."
          exit 1
      - name: Verifica bundle de producao sem placeholder
        env:
          APP_URL: https://sentinela-v2.vercel.app
        run: |
          set -euo pipefail
          html=$(curl -sfL "$APP_URL/")
          # Extrai o primeiro src de script JS do bundle principal
          bundle_path=$(echo "$html" | grep -oP '(?<=src=")[^"]*\.js' | head -1)
          if [ -z "$bundle_path" ]; then
            echo "Aviso: nenhum script JS encontrado no HTML de producao; pulando verificacao de placeholder."
            exit 0
          fi
          bundle_url="${APP_URL%/}${bundle_path}"
          echo "Verificando: $bundle_url"
          if curl -sfL "$bundle_url" | grep -q "placeholder.supabase.co"; then
            echo "::error::Bundle de producao contém placeholder.supabase.co. Variáveis VITE_SUPABASE_* não estão configuradas na Vercel."
            exit 1
          fi
          echo "OK: bundle de producao sem placeholder.supabase.co"
