name: Desktop Build
on:
  push:
    paths: ["desktop-agent/**"]
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
      - run: cd desktop-agent && npm ci
      - run: cd desktop-agent && npm run build
