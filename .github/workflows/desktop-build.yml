name: Desktop Build
on:
  push:
    paths: ["desktop-agent/**"]
jobs:
  # The desktop agent depends on native modules (iohook, screenshot-desktop,
  # active-win) and is packaged with electron-builder --win, none of which can
  # run on hosted CI runners. We therefore validate the agent by type-checking
  # it (deps installed with --ignore-scripts to skip native compilation).
  # Packaging the installer happens in the release pipeline on a Windows host.
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop-agent
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
