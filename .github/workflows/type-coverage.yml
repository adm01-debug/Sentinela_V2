name: Type Coverage
on:
  pull_request:
    paths: ['src/**/*.ts', 'src/**/*.tsx']

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
      - name: Check type coverage
        run: |
          npx type-coverage --at-least 95 --strict
