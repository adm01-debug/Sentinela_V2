name: Performance
on:
  push:
    branches: [main]
jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: treosh/lighthouse-ci-action@c6e89ccf3ec4e8e6b71e2e2009e28a0b7e32d2fd # v12.1.0
        with:
          urls: |
            https://sentinela.app
          uploadArtifacts: true
