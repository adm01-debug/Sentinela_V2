name: Performance
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://sentinela-v2.vercel.app
          uploadArtifacts: true
