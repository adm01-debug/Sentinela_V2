name: Security Scan
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v3
      - uses: github/codeql-action/analyze@v3
