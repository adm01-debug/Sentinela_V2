name: Security Scan
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@45775bd8235c68a3f82a6283b787ef86d6f2c77b # v3.28.4
      - uses: github/codeql-action/analyze@45775bd8235c68a3f82a6283b787ef86d6f2c77b # v3.28.4
