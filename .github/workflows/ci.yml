name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # --ext não existe em flat config (ESLint 9+); os arquivos alvo são
      # definidos em eslint.config.js.
      - name: Lint
        run: npx eslint src/ --max-warnings 0

      - name: Type Check
        run: npx tsc --noEmit

      - name: Security Audit
        run: npm audit --audit-level=high || true

      - name: Bundle Size Check
        run: npm run bundle-check

  # build e test NÃO dependem mais de quality.
  # Antes, `needs: quality` fazia com que qualquer erro de lint ou de tipo
  # deixasse build e test como `skipped` — e a suíte de testes nunca chegou a
  # rodar uma única vez na história do repositório. Rodando em paralelo, cada
  # gate reporta seu próprio resultado e nenhum sinal fica escondido atrás de outro.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: dist/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  deno-contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x
      - name: Run Contract Tests
        run: |
          find supabase/functions -name "*_test.ts" -o -name "*.test.ts" | xargs -I {} deno test --allow-env --allow-net {}

