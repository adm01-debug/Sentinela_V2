name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # Ratchet: falha só se surgir ocorrência nova acima do baseline.
      # Ver scripts/ci/README.md. Baseline capturado em 08/11/2026 (PR #93).
      # `tsc --noEmit` era no-op nesta config (references sem --build); o ratchet
      # usa `tsc -b --force` que respeita as referencias e checa de verdade.
      - name: Lint (ratchet)
        run: node scripts/ci/lint-ratchet.mjs

      - name: Type Check (ratchet)
        run: node scripts/ci/typecheck-ratchet.mjs

      - name: Security Audit
        run: npm audit --audit-level=high || true

      # "npm run build" chama "bun scripts/generate-audit-pdf.js" (package.json);
      # o runner ubuntu-latest não traz bun por padrão.
      - uses: oven-sh/setup-bun@v2
      - name: Bundle Size Check
        run: npm run bundle-check

  # build e test NÃO dependem mais de quality.
  # Antes, `needs: quality` fazia com que qualquer erro de lint ou de tipo
  # deixasse build e test como `skipped` — e a suíte de testes nunca chegou a
  # rodar uma única vez na história do repositório. Rodando em paralelo, cada
  # gate reporta seu próprio resultado e nenhum sinal fica escondido atrás de outro.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # "npm run build" chama "bun scripts/generate-audit-pdf.js" (package.json);
      # o runner ubuntu-latest não traz bun por padrão.
      - uses: oven-sh/setup-bun@v2
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: dist/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  deno-contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x
      - name: Run Contract Tests
        run: |
          find supabase/functions -name "*_test.ts" -o -name "*.test.ts" | xargs -I {} deno test --allow-env --allow-net {}

  # Guard das instruções para agentes (AGENTS.md + CLAUDE.md + docs/agentes/*.md).
  # Job próprio e sem `npm ci` de propósito: o script é node puro, sem dependências,
  # e precisa continuar reportando mesmo quando a instalação do projeto falha.
  agent-instructions-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integridade das instruções para agentes
        run: |
          git fetch --no-tags --depth=1 origin main
          CLAUDE_MD_BASE=FETCH_HEAD node scripts/ci/check-claude-md-integrity.mjs
