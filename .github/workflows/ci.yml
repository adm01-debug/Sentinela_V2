name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # Ratchet: falha só se surgir ocorrência nova acima do baseline.
      # Ver scripts/ci/README.md. Baseline capturado em 08/11/2026 (PR #93).
      # `tsc --noEmit` era no-op nesta config (references sem --build); o ratchet
      # usa `tsc -b --force` que respeita as referencias e checa de verdade.
      - name: Lint (ratchet)
        run: node scripts/ci/lint-ratchet.mjs

      - name: Type Check (ratchet)
        run: node scripts/ci/typecheck-ratchet.mjs

      - name: Security Audit
        run: npm audit --audit-level=high || true

      # "npm run build" chama "bun scripts/generate-audit-pdf.js" (package.json);
      # o runner ubuntu-latest não traz bun por padrão.
      - uses: oven-sh/setup-bun@v2
      - name: Bundle Size Check
        run: npm run bundle-check

  # build e test NÃO dependem mais de quality.
  # Antes, `needs: quality` fazia com que qualquer erro de lint ou de tipo
  # deixasse build e test como `skipped` — e a suíte de testes nunca chegou a
  # rodar uma única vez na história do repositório. Rodando em paralelo, cada
  # gate reporta seu próprio resultado e nenhum sinal fica escondido atrás de outro.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # "npm run build" chama "bun scripts/generate-audit-pdf.js" (package.json);
      # o runner ubuntu-latest não traz bun por padrão.
      - uses: oven-sh/setup-bun@v2
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: dist/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  # Contratos das edges. Mesmo runtime do ratchet de tipos logo abaixo (Deno
  # 2.9.8): com dois runtimes no repo, um contrato pode passar em um e falhar no
  # outro, e o v1.x ja esta fora de suporte. Versao pinada de proposito, pelo
  # mesmo motivo do ratchet (mudar de versao muda o resultado).
  deno-contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.8
      - name: Run Contract Tests
        run: |
          # --node-modules-dir=none: o runner nao tem node_modules e o repositorio
          # tem package.json (Deno entraria em modo node_modules automatico);
          # resolver pelo cache global deixa o resultado igual ao local.
          # --allow-read=supabase/functions: os contratos estaticos leem o fonte
          # das edges para provar o que o codigo faz (ex.: escopo de empresa em
          # toda consulta feita com service_role).
          # --allow-read=supabase,src/integrations: contratos tambem conferem o
          # config.toml e se as tabelas apagadas existem no schema tipado.
          find supabase/functions \( -name "*_test.ts" -o -name "*.test.ts" \) -print0 | xargs -0 -I {} deno test --allow-env --allow-net --allow-read=supabase,src/integrations --node-modules-dir=none {}

  # `deno test` passa com dezenas de erros de tipo no codigo das edges — foi por
  # esse buraco que dois bugs reais chegaram na main (rate limit lendo campo
  # inexistente e destructuring sem default). Este job roda `deno check` nas 88
  # edge functions contra um baseline (scripts/ci/deno-check-baseline.json):
  # a divida de hoje (49 erros, 33 funcoes) fica congelada e qualquer erro NOVO
  # quebra o job. Regenerar o baseline exige aprovacao explicita
  # (node scripts/ci/deno-check-ratchet.mjs --update-baseline).
  #
  # Versao do Deno fixada de proposito: mudar de versao muda o conjunto de
  # diagnosticos e invalidaria o baseline (deno-version alinhada a baseline).
  # Sem `npm ci`: o ratchet e node puro, sem dependencias do projeto.
  deno-typecheck-ratchet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.8
      - name: Deno check (ratchet)
        run: node scripts/ci/deno-check-ratchet.mjs
      - name: Deno check ratchet (testes do parser)
        run: node --test scripts/ci/deno-check-ratchet.unit.mjs

  # Guard das instruções para agentes (AGENTS.md + CLAUDE.md + docs/agentes/*.md).
  # Job próprio e sem `npm ci` de propósito: o script é node puro, sem dependências,
  # e precisa continuar reportando mesmo quando a instalação do projeto falha.
  agent-instructions-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integridade das instruções para agentes
        run: |
          git fetch --no-tags --depth=1 origin main
          CLAUDE_MD_BASE=FETCH_HEAD node scripts/ci/check-claude-md-integrity.mjs

  # Guard das edge functions: toda pasta em supabase/functions precisa ter entrada
  # explícita em supabase/config.toml (e vice-versa) e gate de credencial no código.
  # O buraco voltou em três ondas seguidas (#300, #301, #302) e a chave publicável do
  # front é aceita pelo gateway como JWT: sem gate, a função responde a qualquer
  # visitante do site. Exceções legitimas ficam em scripts/ci/edge-gate-baseline.json
  # com motivo obrigatorio; exceção nova entra como PENDENTE e quebra o job até ser
  # justificada. Sem `npm ci`: node puro, sem dependências do projeto.
  edge-gate-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Gate de credencial nas edge functions
        run: node scripts/ci/edge-gate-guard.mjs
      - name: Edge gate guard (testes do analisador)
        run: node --test scripts/ci/edge-gate-guard.unit.mjs

  # Guarda de valor de papel: `user_roles.role` e do enum public.app_role. Filtrar
  # por um valor que nao existe no enum aborta a consulta inteira no Postgres
  # (22P02), do mesmo jeito que o valor invalido sozinho: 5 edge functions
  # respondiam 403 para todo admin por causa de `super_admin` (#341) e o
  # AuthProvider rebaixava todo admin para 'user' na UI por causa de `supervisor`
  # (#342). A lista de valores validos vem do tipo gerado a partir do banco
  # (src/integrations/supabase/types.ts), sem lista paralela aqui. Sem `npm ci`:
  # node puro, sem dependencias do projeto.
  role-enum-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Filtro de papel em user_roles (enum app_role)
        run: node scripts/ci/role-enum-guard.mjs
      - name: Role enum guard (testes do analisador)
        run: node --test scripts/ci/role-enum-guard.unit.mjs

  # Guarda de drift entre o schema vivo e as migrations: `src/integrations/supabase/types.ts`
  # é gerado a partir do banco, então lista o que EXISTE em produção, enquanto as
  # migrations são o que um ambiente novo reconstrói. Objeto no banco sem CREATE
  # TABLE/VIEW em nenhuma migration nasceu fora do repositório — ninguém sabe com
  # qual DDL e com qual RLS. `docs/agentes/banco.md` registrou 9 tabelas vivas sem
  # migration e 3 delas com RLS desabilitada. A dívida histórica fica em
  # scripts/ci/schema-drift-baseline.json com motivo obrigatório; drift NOVO quebra
  # o job. Sem `npm ci`: node puro, sem dependências do projeto.
  schema-drift-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Objeto no banco sem migration
        run: node scripts/ci/schema-drift-guard.mjs
      - name: Schema drift guard (testes do analisador)
        run: node --test scripts/ci/schema-drift-guard.unit.mjs
