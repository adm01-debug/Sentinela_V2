pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.{js,ts,tsx}"
      run: npx eslint {staged_files}
    types:
      glob: "*.{ts,tsx}"
      run: npx tsc --noEmit
    format:
      glob: "*.{js,ts,tsx,json,md}"
      run: npx prettier --check {staged_files}

commit-msg:
  commands:
    lint:
      run: npx commitlint --edit {1}

pre-push:
  commands:
    test:
      run: npm run test:run
