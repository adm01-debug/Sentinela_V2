steps:
  - name: 'node:20'
    entrypoint: npm
    args: ['ci']
  
  - name: 'node:20'
    entrypoint: npm
    args: ['run', 'build']
  
  - name: 'node:20'
    entrypoint: npm
    args: ['test']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/sentinela:$COMMIT_SHA', '.']

images:
  - 'gcr.io/$PROJECT_ID/sentinela:$COMMIT_SHA'
