apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinela-web
  namespace: sentinela
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sentinela-web
  template:
    metadata:
      labels:
        app: sentinela-web
    spec:
      containers:
      - name: web
        image: sentinela/web:latest
        ports:
        - containerPort: 3000
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
        envFrom:
        - configMapRef:
            name: sentinela-config
        - secretRef:
            name: sentinela-secrets
