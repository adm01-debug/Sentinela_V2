apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sentinela-ingress
  namespace: sentinela
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - sentinela.app
      secretName: sentinela-tls
  rules:
    - host: sentinela.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sentinela-service
                port:
                  number: 80
