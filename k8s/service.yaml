apiVersion: v1
kind: Service
metadata:
  name: sentinela-web
spec:
  type: LoadBalancer
  selector:
    app: sentinela
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sentinela-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - app.sentinela.com
      secretName: sentinela-tls
  rules:
    - host: app.sentinela.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sentinela-web
                port:
                  number: 80