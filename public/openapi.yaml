openapi: 3.0.3
info:
  title: Sentinela API
  version: 1.0.0
  description: API REST para integração com o sistema de monitoramento Sentinela.
servers:
  - url: https://api.sentinela.app
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API Key
paths:
  /api/v1/employees:
    get:
      summary: Lista colaboradores
      responses:
        '200':
          description: Sucesso
  /api/v1/employees/{id}:
    get:
      summary: Detalhe do colaborador
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Sucesso }
  /api/v1/activities:
    get:
      summary: Lista atividades
      responses:
        '200': { description: Sucesso }
  /api/v1/violations:
    get:
      summary: Lista violações
      responses:
        '200': { description: Sucesso }
  /api/v1/reports:
    post:
      summary: Gera novo relatório
      responses:
        '201': { description: Criado }
  /api/v1/webhooks:
    post:
      summary: Registra webhook
      responses:
        '201': { description: Criado }
