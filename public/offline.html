<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#6366f1" />
    <title>Offline - Sentinela</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        text-align: center;
        padding: 20px;
      }
      .container {
        max-width: 400px;
      }
      .icon {
        width: 80px;
        height: 80px;
        margin-bottom: 24px;
        opacity: 0.9;
      }
      h1 {
        font-size: 24px;
        margin-bottom: 12px;
      }
      p {
        opacity: 0.8;
        margin-bottom: 24px;
        line-height: 1.6;
      }
      .btn {
        display: inline-block;
        padding: 12px 24px;
        background: white;
        color: #6366f1;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 600;
        transition: transform 0.2s;
      }
      .btn:hover {
        transform: scale(1.05);
      }
      .status {
        margin-top: 20px;
        font-size: 14px;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path
          d="M1 1l22 22M16.72 11.06A10.94 10.94 0 0119 12.55M5 12.55a10.94 10.94 0 015.17-2.39M10.71 5.05A16 16 0 0122.58 9M1.42 9a15.91 15.91 0 014.7-2.88M8.53 16.11a6 6 0 016.95 0M12 20h.01"
        />
      </svg>
      <h1>You're Offline</h1>
      <p>
        It looks like you've lost your internet connection. Some features may not be available until
        you're back online.
      </p>
      <a
        href="/"
        class="btn"
        onclick="
          window.location.reload();
          return false;
        "
        >Try Again</a
      >
      <p class="status" id="status">Waiting for connection...</p>
    </div>
    <script>
      window.addEventListener("online", () => {
        document.getElementById("status").textContent = "Connected! Redirecting...";
        setTimeout(() => (window.location.href = "/"), 1000);
      });
      if (navigator.onLine) window.location.href = "/";
    </script>
  </body>
</html>
